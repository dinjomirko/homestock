<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efe8dd" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15110e" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Key Record">
  <title>Key Record</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=30">
</head>
<body>
  <header class="top">
    <div class="title-row">
      <h1><svg class="mark" viewBox="0 0 22 40" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="5" r="3.2"/><circle cx="7" cy="9.5" r="3.2"/><circle cx="15" cy="9.5" r="3.2"/><circle cx="11" cy="13" r="2.4"/><path d="M11 15.5V37M11 29h4.5M11 33h3.5M11 37h4.5"/></g></svg><span id="title">Key Record</span></h1>
      <button id="menuBtn" class="icon-btn" aria-label="More options">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
    </div>
    <div id="stockTools">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search everything" autocomplete="off" enterkeyhint="search" aria-label="Search">
      </div>
      <nav id="chips" class="chips" aria-label="Filter"></nav>
    </div>
  </header>

  <main id="main"></main>

  <nav class="tabbar" aria-label="Main">
    <button class="tab" data-view="stock">
      <svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4zm0 0v10l9 4 9-4V7M12 11v10"/></svg>
      <span>Stock</span>
    </button>
    <button id="scanBtn" class="action" aria-label="Scan a barcode">
      <svg viewBox="0 0 24 24"><path d="M3 7V4h3M18 4h3v3M21 17v3h-3M6 20H3v-3M7 8v8M10 8v8M13 8v8M16.5 8v8"/></svg>
      <span>Scan</span>
    </button>
    <button id="speakBtn" class="action" aria-label="Speak a change or ask a question">
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <span>Speak</span>
    </button>
    <button class="tab" data-view="shop">
      <svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h11L21 7H6.2"/><circle cx="9" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg>
      <span>Shop</span><b id="shopBadge" class="badge" hidden></b>
    </button>
    <button class="tab" data-view="cook">
      <svg viewBox="0 0 24 24"><path d="M7 14v6h10v-6M7 17h10"/><path d="M7 14a4 4 0 0 1-.6-7.95A5 5 0 0 1 12 3a5 5 0 0 1 5.6 3.05A4 4 0 0 1 17 14z"/></svg>
      <span>Recipes</span>
    </button>
  </nav>

  <div id="scanner" class="scanner" hidden role="dialog" aria-label="Barcode scanner">
    <div class="scan-top">
      <button class="round-btn" data-close-scan aria-label="Close scanner">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="seg" role="radiogroup" aria-label="What a scan does">
        <button data-mode="add" role="radio">Add</button>
        <button data-mode="use" role="radio">Use</button>
        <button data-mode="check" role="radio">Check</button>
      </div>
      <button id="torchBtn" class="round-btn" aria-label="Flashlight" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>
      </button>
    </div>
    <div id="viewfinder" class="viewfinder">
      <video id="camera" playsinline muted autoplay></video>
      <div class="reticle" aria-hidden="true"><i></i><i></i><i></i><i></i><b class="laser"></b></div>
      <p id="scanHint" class="scan-hint" aria-live="polite"></p>
      <button id="zoomBtn" class="zoom-btn" hidden aria-label="Zoom">1×</button>
    </div>
    <div id="scanCard" class="scan-card" aria-live="polite"></div>
    <button id="typeCodeBtn" class="type-code">Type a barcode instead</button>
  </div>

  <div id="backdrop" class="backdrop" hidden></div>
  <section id="sheet" class="sheet" hidden role="dialog" aria-modal="true"></section>
  <div id="dropTray" class="drop-tray" hidden aria-hidden="true"></div>
  <div id="toast" class="toast" hidden role="status"></div>
  <input id="importFile" type="file" accept="application/json,.json" hidden>

  <script>
    // Safety net: if the app ever fails to start (say a phone mixed old and new files after an
    // update), clear the offline copy and reload once; if that doesn't help, offer a button.
    // Saved items live elsewhere and are never touched.
    (function () {
      function freshReload() {
        var jobs = [];
        if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
        if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
        Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
      }
      setTimeout(function () {
        if (window.homestockReady) return;
        var tried = false;
        try { tried = sessionStorage.getItem('homestock.recovered') === '1'; sessionStorage.setItem('homestock.recovered', '1'); } catch (e) {}
        if (!tried) return freshReload();
        var box = document.createElement('div');
        box.className = 'boot-fail';
        box.innerHTML = '<p>Key Record didn’t start properly. Your items are safe.</p><button type="button">Reload</button>';
        box.querySelector('button').onclick = freshReload;
        document.body.appendChild(box);
      }, 5000);
    })();
  </script>
  <script type="module" src="app.js?v=30"></script>
</body>
</html>
