<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f7a5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Homestock">
  <title>Homestock</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="title-row">
      <h1 id="title">Homestock</h1>
      <button id="menuBtn" class="icon-btn" aria-label="More options">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
    </div>
    <div id="stockTools">
      <input id="search" type="search" placeholder="Search everything" autocomplete="off">
      <nav id="chips" class="chips" aria-label="Filter by place"></nav>
    </div>
  </header>

  <main id="main"></main>

  <nav class="tabbar">
    <button class="tab" data-view="stock">
      <svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4zm0 0v10l9 4 9-4V7M12 11v10"/></svg>
      <span>Stock</span>
    </button>
    <button id="scanBtn" class="action" aria-label="Scan a barcode">
      <svg viewBox="0 0 24 24"><path d="M3 7V4h3M18 4h3v3M21 17v3h-3M6 20H3v-3M7 8v8M10 8v8M13 8v8M16.5 8v8"/></svg>
      <span>Scan</span>
    </button>
    <button id="speakBtn" class="action" aria-label="Speak a change">
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <span>Speak</span>
    </button>
    <button class="tab" data-view="shop">
      <svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h11L21 7H6.2"/><circle cx="9" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg>
      <span>Shop</span><b id="shopBadge" class="badge" hidden></b>
    </button>
  </nav>

  <div id="scanner" class="scanner" hidden>
    <div class="scan-top">
      <button class="icon-btn light" data-close-scan aria-label="Close scanner">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="seg" role="radiogroup" aria-label="Scan mode">
        <button data-mode="add" role="radio">Adding</button>
        <button data-mode="use" role="radio">Using up</button>
      </div>
    </div>
    <div id="reader"></div>
    <p id="scanHint" class="scan-hint">Point the camera at a barcode</p>
    <ul id="scanLog" class="scan-log"></ul>
    <form id="manualCode" class="scan-manual">
      <input inputmode="numeric" autocomplete="off" placeholder="…or type the barcode number" aria-label="Barcode number">
      <button>Go</button>
    </form>
  </div>

  <div id="backdrop" class="backdrop" hidden></div>
  <section id="sheet" class="sheet" hidden role="dialog" aria-modal="true"></section>
  <div id="toast" class="toast" hidden role="status"></div>
  <input id="importFile" type="file" accept="application/json,.json" hidden>

  <script type="module" src="app.js"></script>
</body>
</html>
